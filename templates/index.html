<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Roboto, Arial, sans-serif; padding-bottom: 70px; background-color: #ffffff; color: #0f0f0f; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tag-btn.active { background-color: #0f0f0f; color: #ffffff; }
    </style>
</head>
<body>

<!-- TOP HEADER -->
<header class="flex items-center justify-between px-4 h-14 sticky top-0 bg-white z-50 border-b border-gray-100">
    <div class="flex items-center space-x-2" onclick="resetFeed()">
        <i class="fa-brands fa-youtube text-red-600 text-2xl sm:text-3xl"></i>
        <span class="font-bold text-xl tracking-tighter">YouTube</span>
    </div>

    <!-- Search Input -->
    <div class="flex-1 max-w-md mx-4">
        <div class="flex items-center border border-gray-300 rounded-full px-3 py-1 bg-gray-50 focus-within:bg-white focus-within:border-blue-500">
            <input type="text" id="searchInput" placeholder="Search" onkeydown="if(event.key === 'Enter') handleSearch()" class="w-full bg-transparent outline-none text-sm px-1">
            <button onclick="handleSearch()" class="text-gray-600 pl-2"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </div>

    <!-- User Profile Icon -->
    <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-red-600 text-white rounded-full flex items-center justify-center font-bold text-sm">
            S
        </div>
    </div>
</header>

<!-- TOP FILTER TABS -->
<nav class="flex space-x-2 px-4 py-2.5 overflow-x-auto scrollbar-hide border-b border-gray-200 sticky top-14 bg-white z-40">
    <button onclick="filterCategory('All', this)" class="tag-btn active bg-gray-100 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">All</button>
    <button onclick="filterCategory('Drama', this)" class="tag-btn bg-gray-100 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Drama</button>
    <button onclick="filterCategory('Music', this)" class="tag-btn bg-gray-100 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Music</button>
    <button onclick="filterCategory('Tech', this)" class="tag-btn bg-gray-100 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Tech</button>
    <button onclick="filterCategory('News', this)" class="tag-btn bg-gray-100 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">News</button>
    <button onclick="filterCategory('Gaming', this)" class="tag-btn bg-gray-100 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Gaming</button>
</nav>

<!-- MAIN CONTENT CONTAINER -->
<main class="max-w-5xl mx-auto p-2 sm:p-4">

    <!-- HOME SECTION (FEED) -->
    <section id="home-sec">
        <div id="video-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        <div id="loader" class="text-center py-6 hidden">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-red-600"></i>
        </div>
    </section>

    <!-- PLAYING SECTION -->
    <section id="playing-sec" class="hidden">
        <div class="bg-black rounded-xl overflow-hidden shadow-lg mb-4">
            <div class="aspect-video w-full">
                <iframe id="mainPlayer" class="w-full h-full" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="p-3 bg-white border-t">
                <h1 id="playTitle" class="text-base font-bold line-clamp-2">ভিডিও লোড হচ্ছে...</h1>
                <p id="playChannel" class="text-xs text-gray-500 mt-1">YouTube Channel</p>
                <div class="flex flex-wrap gap-2 mt-4">
                    <button onclick="startDownload('1080p')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-full text-xs font-semibold">
                        <i class="fa-solid fa-download me-1"></i> 1080p MP4
                    </button>
                    <button onclick="startDownload('720p')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full text-xs font-semibold">
                        <i class="fa-solid fa-download me-1"></i> 720p MP4
                    </button>
                    <button onclick="startDownload('mp3')" class="bg-black hover:bg-gray-800 text-white px-4 py-1.5 rounded-full text-xs font-semibold">
                        <i class="fa-solid fa-music me-1"></i> MP3
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- DOWNLOADS SECTION -->
    <section id="download-sec" class="hidden">
        <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
            <i class="fa-solid fa-folder-open text-red-600"></i> My Downloads
        </h2>
        <div id="download-list" class="space-y-2"></div>
    </section>

</main>

<!-- BOTTOM NAVIGATION BAR (Image Matching: Home, Shorts, Download) -->
<footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-50">
    <button onclick="showSection('home')" id="nav-home" class="flex flex-col items-center text-red-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-1 font-medium">Home</span>
    </button>
    <button onclick="loadShorts()" id="nav-shorts" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-bolt text-lg"></i>
        <span class="text-[10px] mt-1 font-medium">Shorts</span>
    </button>
    <button onclick="showSection('download')" id="nav-download" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-download text-lg"></i>
        <span class="text-[10px] mt-1 font-medium">Download</span>
    </button>
</footer>

<script>
    let nextPageToken = "";
    let currentQuery = "Bangla new songs";
    let playingUrl = "";
    let isLoading = false;

    // ১. ভিডিও লোড করা (Home)
    async function loadVideos(q, append = false) {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('loader').classList.remove('hidden');

        try {
            const res = await fetch(`/search?q=${encodeURIComponent(q)}&pageToken=${nextPageToken}`);
            const data = await res.json();
            const feed = document.getElementById('video-feed');

            if (!append) feed.innerHTML = "";

            if (data.videos && data.videos.length > 0) {
                data.videos.forEach(v => {
                    const cleanTitle = v.title.replace(/'/g, "");
                    const firstChar = v.channel ? v.channel[0] : 'Y';
                    
                    feed.innerHTML += `
                        <div class="cursor-pointer group" onclick="playThis('${v.url}', '${v.videoId}', '${cleanTitle}', '${v.channel}')">
                            <div class="relative aspect-video rounded-xl overflow-hidden bg-gray-200">
                                <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200">
                            </div>
                            <div class="flex gap-3 mt-3 px-1">
                                <div class="w-9 h-9 rounded-full bg-gray-300 flex-shrink-0 flex items-center justify-center font-bold text-xs text-gray-700">
                                    ${firstChar}
                                </div>
                                <div class="overflow-hidden">
                                    <h3 class="font-semibold text-sm line-clamp-2 leading-snug text-gray-900">${v.title}</h3>
                                    <p class="text-xs text-gray-600 mt-1">${v.channel || 'YouTube Channel'}</p>
                                </div>
                            </div>
                        </div>`;
                });
                nextPageToken = data.nextPageToken || "";
            }
        } catch (e) {
            console.error(e);
        }

        document.getElementById('loader').classList.add('hidden');
        isLoading = false;
    }

    // ২. প্লে করা (Play Video)
    function playThis(url, videoId, title, channel) {
        playingUrl = url;
        showSection('playing');

        document.getElementById('playTitle').innerText = title;
        document.getElementById('playChannel').innerText = channel || 'YouTube Channel';
        
        // youtube-nocookie দিয়ে প্লে ইমবেড সেট করা হলো
        document.getElementById('mainPlayer').src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1&rel=0`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ৩. সেকশন সুইচ করা
    function showSection(name) {
        document.getElementById('home-sec').classList.add('hidden');
        document.getElementById('playing-sec').classList.add('hidden');
        document.getElementById('download-sec').classList.hidden = true;
        document.getElementById('download-sec').classList.add('hidden');

        // Nav Colors
        document.getElementById('nav-home').className = "flex flex-col items-center text-gray-600";
        document.getElementById('nav-shorts').className = "flex flex-col items-center text-gray-600";
        document.getElementById('nav-download').className = "flex flex-col items-center text-gray-600";

        if (name === 'home') {
            document.getElementById('home-sec').classList.remove('hidden');
            document.getElementById('nav-home').className = "flex flex-col items-center text-red-600";
        } else if (name === 'playing') {
            document.getElementById('playing-sec').classList.remove('hidden');
        } else if (name === 'download') {
            document.getElementById('download-sec').classList.remove('hidden');
            document.getElementById('nav-download').className = "flex flex-col items-center text-red-600";
            loadDownloadFiles();
        }
    }

    // ৪. ক্যাটাগরি ফিল্টার
    function filterCategory(cat, btn) {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentQuery = cat === 'All' ? 'Bangla new songs' : cat;
        nextPageToken = "";
        showSection('home');
        loadVideos(currentQuery);
    }

    // ৫. সার্চ
    function handleSearch() {
        const val = document.getElementById('searchInput').value.trim();
        if (val !== "") {
            currentQuery = val;
            nextPageToken = "";
            showSection('home');
            loadVideos(val);
        }
    }

    // ৬. শর্টস
    function loadShorts() {
        showSection('home');
        document.getElementById('nav-home').className = "flex flex-col items-center text-gray-600";
        document.getElementById('nav-shorts').className = "flex flex-col items-center text-red-600";
        currentQuery = "#shorts";
        nextPageToken = "";
        loadVideos(currentQuery);
    }

    // ৭. ডাউনলোড সম্পর্কিত
    function startDownload(quality) {
        if (!playingUrl) return alert("প্রথমে একটি ভিডিও সিলেক্ট করুন!");
        alert("ডাউনলোড শুরু হচ্ছে... দয়া করে অপেক্ষা করুন।");
        window.location.href = `/download?url=${encodeURIComponent(playingUrl)}&quality=${quality}`;
    }

    async function loadDownloadFiles() {
        const res = await fetch('/get_downloads');
        const files = await res.json();
        const list = document.getElementById('download-list');
        list.innerHTML = files.length ? "" : "<p class='text-gray-500 text-center py-8'>কোন ফাইল ডাউনলোড করা হয়নি।</p>";
        files.forEach(f => {
            list.innerHTML += `
                <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg border border-gray-100">
                    <i class="fa-solid fa-file-video text-red-600 text-xl"></i>
                    <span class="text-xs font-semibold truncate text-gray-800">${f}</span>
                </div>`;
        });
    }

    function resetFeed() {
        document.getElementById('mainPlayer').src = "";
        currentQuery = "Bangla new songs";
        nextPageToken = "";
        showSection('home');
        loadVideos(currentQuery);
    }

    // আনলিমিটেড স্ক্রল
    window.onscroll = () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
            if (!document.getElementById('home-sec').classList.contains('hidden') && nextPageToken) {
                loadVideos(currentQuery, true);
            }
        }
    };

    window.onload = () => loadVideos(currentQuery);
</script>
</body>
  </html>
